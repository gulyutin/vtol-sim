# Desktop app installers (demo profile) for macOS, Windows and Linux.
# Manual runs only (Actions → "Desktop app" → Run workflow).
# Publishes nothing: installers stay as run artifacts for 14 days. No secrets —
# the installers are unsigned (see desktop/README.md).
name: Desktop app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, flag: --mac }
          - { name: Windows, os: windows-latest, flag: --win }
          - { name: Linux, os: ubuntu-latest, flag: --linux }
    env:
      # Do not look for certificates in the runner's keychain: unsigned build.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build installers
        run: npm run desktop:build:demo -- ${{ matrix.flag }}

      - uses: actions/upload-artifact@v4
        with:
          name: vtol-sim-demo-${{ matrix.name }}
          path: |
            release/demo/*.dmg
            release/demo/*.exe
            release/demo/*.AppImage
            release/demo/*.deb
          if-no-files-found: error
          retention-days: 14
